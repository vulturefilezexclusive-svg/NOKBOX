name: Build iOS (unsigned IPA for sideloading)

on:
  push:
    branches: [main]
    tags: ['v*']
  # Also build every pull request: analyze, tests and the real unsigned .ipa
  # run on the proposed branch before it can merge. Without this trigger a PR
  # head had no workflow run at all and the quality gate was invisible.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package NOKBOX.ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry NOKBOX.ipa Payload && rm -rf Payload
          ls -la

      - name: Generate AltStore / SideStore source (apps.json)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          SIZE=$(stat -f%z dist/NOKBOX.ipa)
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then TAG="v$VERSION"; fi
          python3 tools/make_altstore_source.py \
            --version "$VERSION" --size "$SIZE" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/NOKBOX.ipa" \
            --icon-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/branding/icon_source.jpg" \
            --out dist/apps.json

      - uses: actions/upload-artifact@v4
        with:
          name: NOKKBOX-ipa-${{ github.sha }}
          path: |
            dist/NOKBOX.ipa
            dist/apps.json
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NOKBOX.ipa
            dist/apps.json
          generate_release_notes: true
