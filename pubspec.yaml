name: nokbox
description: "NOKBOX — A MUZIK JUNKIE PARADISE. Original multi-source music & video player."
publish_to: 'none'
version: 0.2.1+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  provider: ^6.1.5
  http: ^1.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.4.0
  shared_preferences: ^2.5.6
  sqlite3: ^3.9.1
  audio_metadata_reader: ^1.8.1
  xml: ^6.5.0
  youtube_explode_dart: ^3.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  webview_flutter: ^4.14.1
  collection: ^1.19.1
  crypto: ^3.0.6
  webview_cookie_manager_plus: ^2.0.18
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/eq/

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/branding/icon_source.jpg"
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter_native_splash:
  color: "#000000"
  image: assets/branding/splash.png
  ios: true
  android: false
  web: false
  fullscreen: true
